# Link check for public/. Root-absolute links (/guidester) resolve against
# public/ via --root-dir in the workflow.
# /guidester is served from guidester.html, as Cloudflare does.
fallback_extensions = ["html"]
max_retries = 3
retry_wait_time = 5
timeout = 20
accept = [200, 206, 429]
exclude_path = ["public/404.html"]
# These answer bots with 403/999 whatever the link; checked by hand instead.
exclude = [
  '^https://medium\.com/',
  '^https://(www\.)?linkedin\.com/',
  '^mailto:',
  # egazette.gov.in serves an incomplete certificate chain, so the checker rejects it
  # even though browsers open it. Checked by hand (the Dhara Kosh section pages link it).
  '^https://egazette\.gov\.in/',
  # Absolute self-URLs of the Dhara Kosh pages (canonical tags, sitemap). They 404 until
  # the pages are live; the same pages are checked through their relative links.
  '^https://saurabhupadhyay\.in/dhara-kosh/',
]
